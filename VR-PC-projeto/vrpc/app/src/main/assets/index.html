<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>VR PC</title>
<style>
*{box-sizing:border-box;-webkit-user-select:none;user-select:none}
html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:"Segoe UI",Roboto,Arial,sans-serif;touch-action:none}
#stage{position:fixed;inset:0;display:flex}
.eye{position:relative;flex:1 1 50%;height:100%;overflow:hidden;background:radial-gradient(circle at 50% 40%,#16203a,#05070d 70%)}
.eye.R{border-left:2px solid #000}
.world,.rig{position:absolute;left:50%;top:50%;width:0;height:0;transform-style:preserve-3d}
.ret{position:absolute;left:50%;top:50%;width:30px;height:30px;margin:-15px 0 0 -15px;border-radius:50%;pointer-events:none;z-index:50;
 background:conic-gradient(#4cc2ff var(--p,0%),rgba(255,255,255,.25) 0);
 -webkit-mask:radial-gradient(circle,transparent 8px,#000 9px);mask:radial-gradient(circle,transparent 8px,#000 9px)}
.ret::after{content:"";position:absolute;left:12px;top:12px;width:6px;height:6px;border-radius:50%;background:#fff}
.gz{outline:3px solid #4cc2ff;background-color:rgba(76,194,255,.30)!important}

/* ---- cenas ---- */
.screen,.kb,.table,.calib{position:absolute}
.screen{left:-480px;top:-270px;width:960px;height:540px;background:linear-gradient(135deg,#0a3d91,#1b78d1 45%,#6fb7ff);overflow:hidden;border-radius:10px;color:#fff;font-size:20px;box-shadow:0 0 60px rgba(76,194,255,.35)}
.table{left:-700px;top:-500px;width:1400px;height:1000px;border-radius:40px;background:linear-gradient(#3a2a1d,#1a110b);transform:translate3d(0,420px,700px) rotateX(65deg) translateZ(-2px)}
.kb{left:-250px;top:-140px;width:500px;height:280px;display:flex;flex-direction:column;gap:5px;padding:8px;background:rgba(15,18,26,.92);border-radius:14px;transform:translate3d(0,420px,700px) rotateX(65deg)}
.kr{display:flex;gap:5px;flex:1}
.key{flex:1;display:flex;align-items:center;justify-content:center;background:#e8ecf4;color:#111;border-radius:6px;font-size:22px}
.shift .key[data-id="k:SHIFT"]{background:#4cc2ff}
[data-phase=calib] .screen,[data-phase=calib] .kb,[data-phase=calib] .table{display:none}
[data-phase=ready] .calib{display:none}
[data-phase=ready] .screen,[data-phase=ready] .kb{animation:pop .9s ease-out}
@keyframes pop{from{opacity:0}to{opacity:1}}

.calib{left:-320px;top:-170px;width:640px;height:340px;background:rgba(10,14,28,.93);border:2px solid #4cc2ff;border-radius:18px;color:#fff;text-align:center;padding:20px;font-size:22px;display:flex;flex-direction:column;align-items:center;gap:12px}
.calib h1{margin:0;font-size:30px;font-weight:600}
.calib p{margin:0;color:#b9c7e2}
.pb{width:80%;height:16px;background:#2b3140;border-radius:8px;overflow:hidden}
.pf{height:100%;width:0;background:#4cc2ff}
.calib .btn{margin-top:auto;font-size:22px;padding:10px 24px}

/* ---- desktop ---- */
.icons{position:absolute;left:12px;top:12px;display:grid;grid-template-columns:90px;gap:8px}
.ic{width:90px;text-align:center;font-size:15px;padding:6px;border-radius:8px}
.ic i{display:block;font-style:normal;font-size:40px}
.win{display:none;position:absolute;left:90px;top:20px;width:760px;height:430px;background:#1f2430;border-radius:10px;border:1px solid #556;overflow:hidden;flex-direction:column}
.win.open{display:flex}
.win[data-win=calc],.win[data-win=set]{width:420px;left:270px}
.win.max{left:0;top:0;width:960px;height:490px;border-radius:0}
.tb{display:flex;justify-content:space-between;align-items:center;background:#2b3140;padding:0 6px 0 12px;font-size:18px;height:40px}
.wb b{display:inline-block;width:46px;text-align:center;margin-left:6px;padding:3px 0;border-radius:6px;background:#3a4256;font-weight:400}
.wbody{flex:1;display:flex;flex-direction:column;padding:8px;gap:8px;min-height:0}
.bar{display:flex;gap:8px}
.field{flex:1;min-height:40px;background:#fff;color:#111;border-radius:6px;padding:6px 10px;font-size:20px;overflow:hidden;white-space:nowrap;border:3px solid transparent}
.field.foc{border-color:#4cc2ff}
.field.big{white-space:pre-wrap;word-break:break-all}
.btn{background:#3a4256;padding:6px 14px;border-radius:6px;font-size:18px;white-space:nowrap;display:flex;align-items:center;justify-content:center}
.frame{flex:1;width:100%;border:0;background:#000;border-radius:6px;min-height:0}
.status{font-size:15px;color:#9fb0cc}
.cd{background:#000;font-size:34px;text-align:right;padding:6px 12px;border-radius:6px}
.cg{flex:1;display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.cg .btn{font-size:24px}
.col{display:flex;flex-direction:column;gap:8px}
.task{position:absolute;left:0;right:0;bottom:0;height:50px;background:rgba(20,24,34,.93);display:flex;align-items:center;justify-content:center;gap:8px;z-index:200}
.ti{width:46px;height:42px;display:flex;align-items:center;justify-content:center;font-size:26px;border-radius:6px}
.ti.on{border-bottom:3px solid #4cc2ff;background:rgba(255,255,255,.08)}
.clock{position:absolute;right:12px;font-size:15px;text-align:right;line-height:1.1}
.start{display:none;position:absolute;left:50%;margin-left:-190px;bottom:58px;width:380px;background:rgba(30,35,48,.97);border-radius:12px;padding:12px;z-index:300;grid-template-columns:1fr 1fr 1fr;gap:8px}
.start.open{display:grid}
#cam{position:fixed;left:-10px;top:-10px;width:2px;height:2px;opacity:0;pointer-events:none}
</style>
</head>
<body>
<div id="stage"></div>
<video id="cam" playsinline muted></video>

<script>
(() => {
'use strict';
const KEYROWS = [
  "1234567890".split(''),
  "qwertyuiop".split(''),
  "asdfghjkl'".split(''),
  ['SHIFT',..."zxcvbnm".split(''),'BS'],
  ['.','-','_','/',':','=','?','SPACE','ENTER']
];
const FLEX = {SHIFT:1.6,BS:1.6,SPACE:3,ENTER:2};
const LABEL = {SHIFT:'⇧',BS:'⌫',SPACE:'espaço',ENTER:'⏎'};
const kbHTML = KEYROWS.map(r => '<div class="kr">' + r.map(k =>
  `<div class="key" data-id="k:${k}" ${k.length===1&&/[a-z]/.test(k)?`data-l="${k}"`:''} style="flex:${FLEX[k]||1}">${LABEL[k]||k}</div>`
).join('') + '</div>').join('');

const win = (id,title,icon,body) =>
 `<div class="win" data-win="${id}"><div class="tb" data-id="front:${id}"><span>${icon} ${title}</span><span class="wb"><b data-id="max:${id}">▢</b><b data-id="close:${id}">✕</b></span></div><div class="wbody">${body}</div></div>`;
const btn = (id,t) => `<div class="btn" data-id="${id}">${t}</div>`;

const ytBody = `
 <div class="bar"><div class="field" data-id="focus:yt" data-field="yt"></div>${btn('go:yt','Ir')}</div>
 <div class="bar">${btn('pick:dQw4w9WgXcQ','Vídeo 1')}${btn('pick:jNQXAC9IVRw','Vídeo 2')}${btn('pick:aqz-KE-bpKQ','Vídeo 3')}${btn('yt:play','▶')}${btn('yt:pause','⏸')}${btn('yt:reload','⟳')}</div>
 <div class="status" data-status="yt"></div>
 <iframe class="frame" data-frame="yt" allow="autoplay; encrypted-media; fullscreen" referrerpolicy="strict-origin-when-cross-origin"></iframe>`;
const webBody = `
 <div class="bar"><div class="field" data-id="focus:web" data-field="web"></div>${btn('go:web','Ir')}${btn('wiki:x','Wikipedia')}</div>
 <div class="status" data-status="web"></div>
 <iframe class="frame" data-frame="web" referrerpolicy="strict-origin-when-cross-origin"></iframe>`;
const noteBody = `<div class="field big" style="flex:1" data-id="focus:note" data-field="note"></div>`;
const calcKeys = ['7','8','9','/','4','5','6','*','1','2','3','-','0','.','=','+'];
const calcL = {'/':'÷','*':'×','-':'−'};
const calcBody = `<div class="cd" data-calc></div><div class="cg">${calcKeys.map(k=>btn('calc:'+k,calcL[k]||k)).join('')}${btn('calc:C','C')}</div>`;
const setBody = `<div class="col">
 ${btn('set:invyaw','')}${btn('set:invpitch','')}${btn('set:sens+','Sensibilidade +')}${btn('set:sens-','Sensibilidade −')}
 ${btn('recenter','Recentralizar visão')}${btn('recal','Refazer teclado (palmas)')}</div>`;

const APPS = [['yt','YouTube','▶️'],['web','Navegador','🌐'],['note','Notas','📝'],['calc','Calculadora','🧮'],['set','Config.','⚙️']];

const eyeHTML = () => `
<div class="world"><div class="rig">
  <div class="calib"><h1>✋✋ Coloque as duas palmas sobre a mesa</h1>
   <p>Deixe as mãos abertas na frente da câmera</p>
   <div class="pb"><div class="pf" data-pf></div></div>
   <p data-hands></p>${btn('skip','Pular (sem câmera)')}</div>
  <div class="table"></div>
  <div class="kb">${kbHTML}</div>
  <div class="screen">
    <div class="icons">${APPS.map(a=>`<div class="ic" data-id="app:${a[0]}"><i>${a[2]}</i>${a[1]}</div>`).join('')}</div>
    ${win('yt','YouTube','▶️',ytBody)}${win('web','Navegador','🌐',webBody)}${win('note','Bloco de Notas','📝',noteBody)}
    ${win('calc','Calculadora','🧮',calcBody)}${win('set','Configurações','⚙️',setBody)}
    <div class="start">${APPS.map(a=>`<div class="ic" data-id="app:${a[0]}"><i>${a[2]}</i>${a[1]}</div>`).join('')}</div>
    <div class="task"><div class="ti" data-id="start">⊞</div>${APPS.map(a=>`<div class="ti" data-tb="${a[0]}" data-id="tb:${a[0]}">${a[2]}</div>`).join('')}<div class="clock" data-clock></div></div>
  </div>
</div></div><div class="ret"></div>`;

const stage = document.getElementById('stage');
const eyes = [0,1].map(i => { const d=document.createElement('div'); d.className='eye '+(i?'R':'L'); d.innerHTML=eyeHTML(); stage.appendChild(d); return d; });

/* ---------------- estado ---------------- */
let saved = {}; try { saved = JSON.parse(localStorage.getItem('vrpc')||'{}'); } catch(e){}
const S = {
  phase:'calib', open:{}, max:{}, z:[], focus:'', start:false, shift:false,
  text:{yt:'',web:'',note:''}, status:{yt:'Digite um link ou ID do YouTube',web:'Digite um endereço (muitos sites bloqueiam iframe)'},
  ytId:null, webUrl:null, nonce:0, hold:0, pct:0, handsTxt:'Iniciando câmera…',
  calc:{disp:'0',acc:null,op:null,fresh:true},
  set:{invyaw:!!saved.invyaw, invpitch:!!saved.invpitch, sens:saved.sens||1}
};
const saveSet = () => { try{localStorage.setItem('vrpc',JSON.stringify(S.set));}catch(e){} };

const front = id => { S.z = S.z.filter(x=>x!==id); S.z.push(id); };
function openApp(id){ S.open[id]=true; front(id); S.start=false; if(['yt','web','note'].includes(id)) S.focus=id; }
function parseYT(t){
  t=t.trim(); let m=t.match(/(?:v=|youtu\.be\/|embed\/|shorts\/)([\w-]{11})/);
  if(m) return m[1]; return /^[\w-]{11}$/.test(t)?t:null;
}
function go(w){
  if(w==='yt'){ const id=parseYT(S.text.yt); if(!id){S.status.yt='Link/ID inválido';return;} S.ytId=id; S.nonce++; S.status.yt='Carregando…'; }
  else if(w==='web'){ let u=S.text.web.trim(); if(!u)return; if(!/^https?:\/\//.test(u)) u='https://'+u; S.webUrl=u; S.nonce++; S.status.web='Carregando…'; }
}
function typeKey(k){
  const f=S.focus; if(k==='SHIFT'){S.shift=!S.shift;return;}
  if(!f||!S.open[f]) return;
  if(k==='BS'){S.text[f]=S.text[f].slice(0,-1);return;}
  if(k==='ENTER'){ if(f==='note') S.text.note+='\n'; else go(f); return; }
  let ch = k==='SPACE'?' ':k; if(S.shift){ch=ch.toUpperCase();S.shift=false;} S.text[f]+=ch;
}
function calc(k){
  let c=S.calc;
  if(/^[0-9.]$/.test(k)){ if(c.fresh){c.disp=k==='.'?'0.':k;c.fresh=false;} else if(!(k==='.'&&c.disp.includes('.'))) c.disp+=k; }
  else if(k==='C'){ S.calc={disp:'0',acc:null,op:null,fresh:true}; }
  else {
    const v=parseFloat(c.disp);
    if(c.op&&!c.fresh){ const a=c.acc; c.acc = c.op==='+'?a+v:c.op==='-'?a-v:c.op==='*'?a*v:a/v; c.disp=isFinite(c.acc)?String(+c.acc.toFixed(8)):'Erro'; }
    else c.acc=v;
    c.fresh=true; c.op=k==='='?null:k;
  }
}
function ytCmd(fn){ eyes.forEach(r=>{ const f=r.querySelector('[data-frame=yt]'); try{ f.contentWindow.postMessage(JSON.stringify({event:'command',func:fn,args:[]}),'*'); }catch(e){} }); }

let yaw=0,pitch=0;
function fire(id){
  const i=id.indexOf(':'); const a=i<0?id:id.slice(0,i), b=i<0?'':id.slice(i+1);
  if(S.start && !['start','app'].includes(a)) S.start=false;
  switch(a){
    case 'app': openApp(b); break;
    case 'tb': if(S.open[b]&&S.z[S.z.length-1]===b){S.open[b]=false;} else openApp(b); break;
    case 'close': S.open[b]=false; S.z=S.z.filter(x=>x!==b); if(S.focus===b) S.focus=['yt','web','note'].find(k=>S.open[k])||''; break;
    case 'max': S.max[b]=!S.max[b]; break;
    case 'front': front(b); if(['yt','web','note'].includes(b)) S.focus=b; break;
    case 'focus': S.focus=b; front(b); break;
    case 'k': typeKey(b); break;
    case 'go': go(b); break;
    case 'pick': S.ytId=b; S.text.yt=b; S.nonce++; S.status.yt='Carregando…'; break;
    case 'yt': if(b==='play')ytCmd('playVideo'); else if(b==='pause')ytCmd('pauseVideo'); else {S.nonce++; if(!S.ytId) S.status.yt='Nada para recarregar';} break;
    case 'wiki': S.webUrl='https://pt.m.wikipedia.org'; S.text.web='pt.m.wikipedia.org'; S.nonce++; break;
    case 'start': S.start=!S.start; break;
    case 'calc': calc(b); break;
    case 'set':
      if(b==='invyaw') S.set.invyaw=!S.set.invyaw;
      else if(b==='invpitch') S.set.invpitch=!S.set.invpitch;
      else if(b==='sens+') S.set.sens=Math.min(3,+(S.set.sens+0.1).toFixed(2));
      else if(b==='sens-') S.set.sens=Math.max(0.3,+(S.set.sens-0.1).toFixed(2));
      saveSet(); break;
    case 'recenter': yaw=0; pitch=0; break;
    case 'recal': startCalib(); break;
    case 'skip': finishCalib(); break;
  }
  render();
}
const repeatable = id => id.startsWith('k:') || id.startsWith('calc:') || id.startsWith('set:sens');

/* ---------------- render (espelha nos dois olhos) ---------------- */
const ytURL = left => `https://www.youtube.com/embed/${S.ytId}?autoplay=1&playsinline=1&rel=0&enablejsapi=1&mute=${left?0:1}&n=${S.nonce}`;
function render(){
  eyes.forEach((r,idx)=>{
    const qa=s=>r.querySelectorAll(s), q=s=>r.querySelector(s);
    r.dataset.phase=S.phase; r.classList.toggle('shift',S.shift);
    qa('.win').forEach(w=>{const id=w.dataset.win; w.classList.toggle('open',!!S.open[id]); w.classList.toggle('max',!!S.max[id]); w.style.zIndex=10+S.z.indexOf(id);});
    qa('.field').forEach(f=>{const k=f.dataset.field; f.textContent=S.text[k]+(S.focus===k?'▌':''); f.classList.toggle('foc',S.focus===k); f.scrollLeft=f.scrollWidth;});
    q('[data-status=yt]').textContent=S.status.yt; q('[data-status=web]').textContent=S.status.web;
    const fy=q('[data-frame=yt]'), wy=S.ytId?ytURL(idx===0):'about:blank';
    if(fy.dataset.cur!==wy){fy.dataset.cur=wy; fy.src=wy;}
    const fw=q('[data-frame=web]'), ww=S.webUrl||'about:blank';
    if(fw.dataset.cur!==ww+S.nonce){fw.dataset.cur=ww+S.nonce; fw.src=ww;}
    q('.start').classList.toggle('open',S.start);
    qa('[data-tb]').forEach(t=>t.classList.toggle('on',!!S.open[t.dataset.tb]));
    q('[data-calc]').textContent=S.calc.disp;
    qa('.key[data-l]').forEach(k=>k.textContent=S.shift?k.dataset.l.toUpperCase():k.dataset.l);
    q('[data-id="set:invyaw"]').textContent='Inverter giro horizontal: '+(S.set.invyaw?'SIM':'não');
    q('[data-id="set:invpitch"]').textContent='Inverter giro vertical: '+(S.set.invpitch?'SIM':'não');
    q('[data-pf]').style.width=S.pct+'%'; q('[data-hands]').textContent=S.handsTxt;
  });
}
function tickClock(){ const d=new Date(); const t=d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})+'\n'+d.toLocaleDateString('pt-BR');
  eyes.forEach(r=>{const c=r.querySelector('[data-clock]'); c.innerHTML=t.replace('\n','<br>');}); }
setInterval(tickClock,1000);

/* ---------------- calibração das mãos ---------------- */
function startCalib(){ S.phase='calib'; S.hold=0; S.pct=0; S.start=false; S.handsTxt='Iniciando câmera…'; if(window.__hands) window.__hands.start(); }
function finishCalib(){ S.phase='ready'; S.pct=0; yaw=0; pitch=0; if(window.__hands) window.__hands.stop(); render(); }
window.__vr = {
  phase:()=>S.phase,
  status:t=>{ if(S.phase==='calib'){S.handsTxt=t;render();} },
  hands:(n,ok,dt)=>{
    if(S.phase!=='calib') return;
    S.hold = ok ? S.hold+dt : Math.max(0,S.hold-dt*2);
    S.pct = Math.min(100,Math.round(S.hold/1.5*100));
    S.handsTxt = `Mãos detectadas: ${n}/2` + (ok?' ✓ segure assim':'');
    if(S.hold>=1.5) finishCalib(); else render();
  },
  handsError:e=>{ S.handsTxt='Câmera/detector indisponível ('+((e&&e.name)||e)+'). Use "Pular".'; render(); }
};

/* ---------------- layout 3D estéreo ---------------- */
let P=600;
function layout(){
  const w=eyes[0].clientWidth; P=w*1.1; const D=P*0.5, s=w/800;
  eyes.forEach(r=>{ r.style.perspective=P+'px'; r.querySelector('.rig').style.transform=`translateZ(${-D}px) scale(${s})`; });
}
addEventListener('resize',layout);

/* ---------------- giroscópio (rastreio de cabeça) ---------------- */
let lastM=0;
addEventListener('devicemotion',e=>{
  const r=e.rotationRate; if(!r||r.beta==null) return;
  const t=performance.now(), dt=lastM?(t-lastM)/1000:0; lastM=t; if(dt<=0||dt>0.2) return;
  const ang=(screen.orientation&&screen.orientation.angle)||90, f=ang===270?-1:1;
  yaw   += -f*r.beta *dt*S.set.sens*(S.set.invyaw?-1:1);
  pitch += -f*r.gamma*dt*S.set.sens*(S.set.invpitch?-1:1);
  pitch=Math.max(-80,Math.min(80,pitch));
});

/* ---------------- olhar (gaze) + toque ---------------- */
const DW=1000; let tgt=null,since=0,locked=null;
function mark(id){ eyes.forEach(r=>{ r.querySelectorAll('.gz').forEach(e=>e.classList.remove('gz')); if(id){const el=r.querySelector('[data-id="'+id+'"]'); if(el) el.classList.add('gz');} }); }
function setProg(p){ eyes.forEach(r=>r.querySelector('.ret').style.setProperty('--p',(p*100)+'%')); }
function frame(now){
  const w=`translateZ(${P}px) rotateX(${pitch}deg) rotateY(${yaw}deg) translateZ(${-P}px)`;
  eyes.forEach(r=>r.querySelector('.world').style.transform=w);
  const b=eyes[0].getBoundingClientRect();
  const el=document.elementFromPoint(b.left+b.width/2,b.top+b.height/2);
  const t=el&&el.closest?el.closest('[data-id]'):null, id=t?t.dataset.id:null;
  if(id!==locked) locked=null;
  if(id!==tgt){tgt=id;since=now;mark(id);}
  if(id&&id!==locked){
    const p=(now-since)/DW;
    if(p>=1){ fire(id); since=now; if(!repeatable(id)){locked=id;mark(null);tgt=null;} setProg(0);} else setProg(p);
  } else setProg(0);
  requestAnimationFrame(frame);
}
addEventListener('touchstart',e=>{ e.preventDefault(); if(tgt){ const id=tgt; fire(id); if(!repeatable(id)){locked=id;} since=performance.now(); } },{passive:false});

layout(); render(); tickClock(); requestAnimationFrame(frame);
})();
</script>

<script type="module">
const video=document.getElementById('cam');
let lm=null, running=false, lastT=0, stream=null;
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
function isOpen(h){ const w=h[0]; let n=0; for(const [t,p] of [[8,6],[12,10],[16,14],[20,18]]) if(dist(h[t],w)>dist(h[p],w)*1.15) n++; return n>=3; }
const V='https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14';
async function load(){
  window.__vr.status('Carregando detector de mãos…');
  const {HandLandmarker,FilesetResolver}=await import(V+'/vision_bundle.mjs');
  const fs=await FilesetResolver.forVisionTasks(V+'/wasm');
  let err;
  for(const d of ['GPU','CPU']){
    try{ lm=await HandLandmarker.createFromOptions(fs,{baseOptions:{modelAssetPath:'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task',delegate:d},runningMode:'VIDEO',numHands:2}); return; }catch(e){err=e;}
  }
  throw err;
}
async function start(){
  running=true;
  try{
    if(!lm) await load();
    if(!stream){
      window.__vr.status('Abrindo câmera…');
      stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment',width:640,height:480},audio:false});
      video.srcObject=stream; await video.play();
    }
  }catch(e){ running=false; window.__vr.handsError(e); return; }
  lastT=performance.now(); loop();
}
function stop(){ running=false; if(stream){stream.getTracks().forEach(t=>t.stop()); stream=null; video.srcObject=null;} }
function loop(){
  if(!running) return;
  if(video.readyState>=2){
    const now=performance.now();
    if(now-lastT>=66){
      const dt=(now-lastT)/1000; lastT=now;
      try{ const r=lm.detectForVideo(video,now); const hs=r.landmarks||[]; window.__vr.hands(hs.length,hs.length>=2&&hs.every(isOpen),dt); }catch(e){}
    }
  }
  requestAnimationFrame(loop);
}
window.__hands={start,stop};
if(window.__vr.phase()==='calib') start();
</script>
