name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Localizar projeto Gradle
        id: find
        run: |
          F=$(find . -name settings.gradle.kts | head -n1)
          if [ -z "$F" ]; then echo "settings.gradle.kts NAO encontrado"; find . -maxdepth 3 -not -path "./.git/*"; exit 1; fi
          D=$(dirname "$F")
          echo "Projeto em: $D"
          echo "dir=$D" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-34 build-tools;34.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Build debug APK
        working-directory: ${{ steps.find.outputs.dir }}
        shell: bash
        run: |
          set -o pipefail
          gradle assembleDebug --stacktrace --console=plain 2>&1 | tee build.log

      - name: Mostrar erro (se falhou)
        if: failure()
        working-directory: ${{ steps.find.outputs.dir }}
        run: |
          grep -n -B2 -A12 -E "What went wrong|error:|FAILURE" build.log | head -80

      - uses: actions/upload-artifact@v4
        with:
          name: VR-PC-apk
          path: ${{ steps.find.outputs.dir }}/app/build/outputs/apk/debug/*.apk
